# Build the image and run scripts/smoke_container.sh.
# A version tag (v*) builds the cu128 image and pushes it to GHCR.
# pull_request and workflow_dispatch build the CPU variant and do not push.
name: image

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk and record it
        run: |
          set -eux
          echo "===== df before ====="
          df -h /
          # GitHub documents 14 GB SSD for ubuntu-24.04. The image also
          # preinstalls toolchains under these paths. Removing them is what
          # makes a multi-gigabyte image build fit. The log is the measurement.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/chromium \
            /usr/local/julia* \
            /usr/lib/jvm \
            /opt/microsoft
          if [[ -n "${AGENT_TOOLSDIRECTORY:-}" && "${AGENT_TOOLSDIRECTORY}" != "/" ]]; then
            sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          fi
          sudo docker image prune -af || true
          echo "===== df after ====="
          df -h /

      - name: Smoke the CPU image
        if: github.event_name != 'push'
        run: bash scripts/smoke_container.sh
        env:
          STT_TORCH_VARIANT: cpu

      - name: Smoke the cu128 image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/smoke_container.sh
        env:
          STT_TORCH_VARIANT: cu128

      - name: Push the version tag to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eux
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME}"
          docker tag stt-runpod:smoke-cu128 "ghcr.io/huagya/simpletuner-template:${version}"
          docker tag stt-runpod:smoke-cu128 ghcr.io/huagya/simpletuner-template:latest
          docker push "ghcr.io/huagya/simpletuner-template:${version}"
          docker push ghcr.io/huagya/simpletuner-template:latest
